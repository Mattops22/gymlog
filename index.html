<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GYM">
<meta name="theme-color" content="#f5f3ef">
<title>GYM</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ef;
  --surface: #ffffff;
  --surface2: #eeecea;
  --surface3: #e5e2dd;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #1a1a1a;
  --text2: #5a5a5a;
  --text3: #999;
  --accent: #1a1a1a;
  --accent-light: #2d2d2d;
  --red: #c0392b;
  --green: #27ae60;
  --week-a: #8b1a1a;
  --week-b: #2d6a4f;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;overscroll-behavior:none;}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}

/* HEADER */
.app-header{padding:calc(var(--safe-top) + 14px) 18px 0;background:var(--bg);position:sticky;top:0;z-index:100;}
.header-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;}
.app-title{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;letter-spacing:2px;color:var(--text);line-height:1;}
.week-toggle{display:flex;gap:0;border:1.5px solid var(--border2);border-radius:8px;overflow:hidden;}
.week-btn{padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.week-btn.active-a{background:var(--week-a);color:#fff;}
.week-btn.active-b{background:var(--week-b);color:#fff;}

/* TABS */
.tab-bar{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;padding:6px 13px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;color:var(--text2);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.8px;cursor:pointer;transition:all .15s;}
.tab-btn.active{background:var(--week-a);color:#fff;border-color:var(--week-a);}
.tab-btn.active-a{background:var(--week-a);color:#fff;border-color:var(--week-a);}
.tab-btn.active-b{background:var(--week-b);color:#fff;border-color:var(--week-b);}

/* MAIN */
.main-content{flex:1;overflow-y:auto;padding:14px 18px;padding-bottom:calc(var(--safe-bottom) + 86px);scrollbar-width:none;}
.main-content::-webkit-scrollbar{display:none;}
.section{display:none;}
.section.active{display:block;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat-card{background:var(--surface);border-radius:10px;padding:11px 10px;border:1px solid var(--border);}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--text);line-height:1;}
.stat-val.hi{color:var(--week-a);}

/* EXERCISE CARDS */
.ex-card{background:var(--surface);border-radius:12px;border:1px solid var(--border);margin-bottom:9px;overflow:hidden;}
.ex-header{display:flex;justify-content:space-between;align-items:center;padding:11px 13px 9px;border-bottom:1px solid var(--border);}
.ex-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.5px;color:var(--text);}
.ex-sets-badge{font-size:11px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.5px;}
.ex-pr{font-size:11px;color:var(--green);margin-top:1px;font-weight:400;}
.ex-header-right{display:flex;gap:7px;align-items:center;}
.btn-add-set{font-size:12px;padding:4px 9px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;color:var(--text2);font-family:'Barlow',sans-serif;cursor:pointer;}
.btn-add-set:active{background:var(--surface2);}

/* SETS */
.sets-wrap{padding:8px 13px 10px;}
.set-col-headers{display:grid;grid-template-columns:26px 1fr 1fr 30px 22px;gap:5px;padding:0 1px 5px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.set-ch{font-size:10px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.05em;text-align:center;}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 30px 22px;gap:5px;align-items:center;margin-bottom:5px;}
.set-num{font-size:12px;color:var(--text3);text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;}
.set-input{background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 4px;font-size:14px;font-family:'Barlow',sans-serif;font-weight:500;color:var(--text);text-align:center;width:100%;}
.set-input:focus{outline:none;border-color:var(--text);background:#fff;}
.set-input.done-inp{border-color:rgba(39,174,96,.35);background:rgba(39,174,96,.06);color:var(--green);}
.set-input::placeholder{color:var(--text3);font-size:12px;}
.done-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.done-btn.done{background:var(--green);border-color:var(--green);}
.del-btn{width:20px;height:20px;border:none;background:transparent;color:var(--text3);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Barlow',sans-serif;padding:0;}
.del-btn:active{color:var(--red);}

/* SECTION DIVIDERS */
.muscle-divider{display:flex;align-items:center;gap:10px;margin:18px 0 10px;}
.muscle-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;white-space:nowrap;}
.muscle-line{flex:1;height:1px;background:var(--border2);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(245,243,239,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border2);padding:8px 10px calc(var(--safe-bottom) + 8px);display:flex;justify-content:space-around;z-index:200;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:5px 10px;border-radius:8px;}
.nav-btn svg{width:22px;height:22px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-btn span{font-size:10px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.8px;}
.nav-btn.active svg{stroke:var(--text);}
.nav-btn.active span{color:var(--text);}

/* CARDIO */
.cardio-session-card{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.cardio-type-row{display:flex;gap:7px;margin-bottom:14px;}
.ctype-btn{flex:1;padding:9px 5px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.8px;color:var(--text2);cursor:pointer;transition:all .15s;}
.ctype-btn.active{background:var(--text);color:#fff;border-color:var(--text);}
.cardio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.cardio-field{display:flex;flex-direction:column;gap:4px;}
.cardio-field-label{font-size:10px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.cardio-input{background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:9px 10px;font-size:14px;font-family:'Barlow',sans-serif;color:var(--text);width:100%;}
.cardio-input:focus{outline:none;border-color:var(--text);}
.intensity-row{display:flex;gap:6px;margin-bottom:10px;}
.int-btn{flex:1;padding:8px;border-radius:7px;border:1.5px solid var(--border2);background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--text2);cursor:pointer;transition:all .15s;}
.int-btn.low.active{background:#e8f5e9;color:#27ae60;border-color:#27ae60;}
.int-btn.mod.active{background:#fff3e0;color:#e67e22;border-color:#e67e22;}
.int-btn.high.active{background:#fdecea;color:#c0392b;border-color:#c0392b;}
.notes-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:9px 10px;font-size:13px;font-family:'Barlow',sans-serif;color:var(--text);resize:none;min-height:60px;margin-bottom:10px;}
.notes-input:focus{outline:none;border-color:var(--text);}
.log-btn{width:100%;padding:11px;background:var(--text);border:none;border-radius:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.log-btn:active{opacity:.85;}

/* KETTLEBELL */
.kb-timer-card{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:12px;}
.kb-timer-display{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:800;text-align:center;letter-spacing:2px;color:var(--text);line-height:1;margin:10px 0;}
.kb-timer-display.rest-phase{color:var(--week-b);}
.kb-phase-label{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--text2);margin-bottom:6px;}
.kb-rounds-info{text-align:center;font-size:13px;color:var(--text3);margin-bottom:14px;}
.kb-controls-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.kb-ctrl-field{display:flex;flex-direction:column;gap:4px;}
.kb-ctrl-label{font-size:10px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.06em;text-align:center;}
.kb-ctrl-input{background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:8px 6px;font-size:18px;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--text);text-align:center;width:100%;}
.kb-ctrl-input:focus{outline:none;border-color:var(--text);}
.kb-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kb-start-btn{padding:12px;border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.kb-start-btn.go{background:var(--text);color:#fff;}
.kb-start-btn.stop{background:#fdecea;color:var(--red);border:1.5px solid var(--red);}
.kb-start-btn.reset{background:var(--surface2);color:var(--text2);border:1.5px solid var(--border2);}
.kb-ex-list{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;}
.kb-ex-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);}
.kb-ex-item:last-child{border-bottom:none;}
.kb-ex-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.kb-ex-dot.active-ex{background:var(--week-b);}
.kb-ex-name{font-size:14px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.3px;}

/* HISTORY */
.history-day{margin-bottom:20px;}
.history-day-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.hist-entry{background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:12px 13px;margin-bottom:6px;}
.hist-entry-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.hist-entry-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.4px;color:var(--text);}
.hist-entry-meta{font-size:12px;color:var(--text2);margin-top:2px;}
.hist-badge{font-size:10px;padding:3px 7px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
.badge-a{background:#8b1a1a;color:#fff;}
.badge-b{background:#2d6a4f;color:#fff;}
.badge-cardio{background:#e8f5e9;color:#27ae60;}
.badge-kb{background:#fdecea;color:var(--red);}
.hist-actions{display:flex;gap:6px;margin-top:8px;}
.hist-action-btn{font-size:12px;padding:5px 10px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;color:var(--text2);font-family:'Barlow',sans-serif;cursor:pointer;}
.hist-action-btn.del{color:var(--red);border-color:rgba(192,57,43,.3);}
.hist-action-btn:active{background:var(--surface2);}

/* EDIT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:flex-end;}
.modal-sheet{background:var(--bg);border-radius:16px 16px 0 0;width:100%;max-width:430px;margin:0 auto;padding:16px 18px calc(var(--safe-bottom)+20px);max-height:80vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:1px;margin-bottom:14px;}
.modal-close{float:right;background:none;border:none;font-size:22px;color:var(--text2);cursor:pointer;line-height:1;margin-top:-4px;}
.modal-set-row{display:grid;grid-template-columns:26px 1fr 1fr 22px;gap:6px;align-items:center;margin-bottom:6px;}
.modal-save-btn{width:100%;margin-top:14px;padding:12px;background:var(--text);border:none;border-radius:8px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--safe-bottom)+86px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.5px;opacity:0;transition:all .22s;z-index:400;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;color:var(--text3);}
.empty-icon{font-size:38px;opacity:.25;margin-bottom:10px;}
.empty-txt{font-size:14px;}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <div class="app-title">GYM</div>
    <div class="week-toggle">
      <button class="week-btn active-a" id="wbtn-a" onclick="setWeek('A')">WEEK A</button>
      <button class="week-btn" id="wbtn-b" onclick="setWeek('B')">WEEK B</button>
    </div>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
</header>
<main class="main-content" id="main"></main>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-workout" onclick="switchNav('workout')">
    <svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>
    <span>WORKOUT</span>
  </button>
  <button class="nav-btn" id="nav-cardio" onclick="switchNav('cardio')">
    <svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 1 0 9 9"/><path d="M12 6v6l4 2"/></svg>
    <span>CARDIO</span>
  </button>
  <button class="nav-btn" id="nav-kb" onclick="switchNav('kb')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 8a6 6 0 0 0 12 0"/><path d="M12 11v10"/><path d="M8 21h8"/></svg>
    <span>KB</span>
  </button>
  <button class="nav-btn" id="nav-history" onclick="switchNav('history')">
    <svg viewBox="0 0 24 24"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h6v6h-6z"/></svg>
    <span>HISTORY</span>
  </button>
</nav>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const PROGRAM = {
  A: {
    chest: [
      {name:'Barbell bench press',sets:5},
      {name:'Incline dumbbell press',sets:4},
      {name:'Dumbbell fly',sets:3},
      {name:'Weighted dips',sets:3},
      {name:'Low to high cable fly',sets:3},
      {name:'OHP barbell',sets:4},
    ],
    back: [
      {name:'Weighted pull-ups',sets:3},
      {name:'Trap bar deadlift',sets:5},
      {name:'Barbell bent over row',sets:4},
      {name:'Seated cable row',sets:3},
      {name:'Face pulls',sets:3},
    ],
    legs: [
      {name:'Barbell back squat',sets:5},
      {name:'Romanian deadlift',sets:4},
      {name:'Leg press',sets:4},
      {name:'Walking lunges',sets:3},
    ],
    arms: [
      {name:'Close grip bench press',sets:4},
      {name:'EZ bar curl',sets:4},
      {name:'Overhead tricep ext (cable)',sets:3},
      {name:'Incline dumbbell curl',sets:3},
      {name:'Tricep rope pushdown',sets:3},
      {name:'Hammer curl',sets:3},
    ],
  },
  B: {
    chest: [
      {name:'Dumbbell bench press',sets:5},
      {name:'Barbell incline press',sets:4},
      {name:'Low to high dumbbell fly',sets:4},
      {name:'Machine chest press',sets:3},
      {name:'Push-up variation',sets:3},
      {name:'Pec deck machine',sets:3},
    ],
    back: [
      {name:'Trap bar deadlift',sets:5},
      {name:'Chest supported dumbbell row',sets:4},
      {name:'Lat pulldown',sets:4},
      {name:'Machine low row',sets:3},
      {name:'Machine reverse fly',sets:3},
    ],
    legs: [
      {name:'Hack squat',sets:5},
      {name:'Bulgarian split squat',sets:4},
      {name:'Leg extension',sets:3},
      {name:'Standing leg curl',sets:3},
      {name:'Goblet squat',sets:3},
    ],
    arms: [
      {name:'Weighted dips',sets:4},
      {name:'Hammer curls',sets:3},
      {name:'Skull crushers EZ bar',sets:3},
      {name:'Single arm overhead DB ext',sets:3},
      {name:'Reverse curl',sets:3},
    ],
  },
  shoulders: [
    {name:'Dumbbell OHP',sets:4},
    {name:'DB lateral raise',sets:3},
    {name:'DB front raise',sets:3},
    {name:'Reverse flys',sets:3},
    {name:'Barbell upright row',sets:3},
  ],
};
const KB_EXERCISES = ['Kneeling front raise','Rotational curl to thruster','Single leg RDL to knee drive','Swing','Woodchop','KB curl to pullover','Lunge pass through','Over shoulder toss'];
const MUSCLE_TABS = ['chest','back','legs','arms','shoulders'];
const MUSCLE_LABELS = {chest:'Chest',back:'Back',legs:'Legs',arms:'Arms',shoulders:'Shoulders'};

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentWeek = 'A';
let activeTab = 'chest';
let activeNav = 'workout';
let workoutSets = {};   // key => [{kg,reps,done}]
let cardioState = {type:'Run', dur:'', dist:'', hr:'', cals:'', pace:'', intensity:'', notes:''};
let kbState = {work:30, rest:15, rounds:3, running:false, phase:'work', timeLeft:30, currentRound:1, timer:null, currentEx:0};

function loadAll() {
  try {
    const ws = localStorage.getItem('lift_sets');
    if (ws) workoutSets = JSON.parse(ws);
  } catch(e) { workoutSets = {}; }
}
function saveAll() {
  try { localStorage.setItem('lift_sets', JSON.stringify(workoutSets)); } catch(e) {}
}
function getHistory() {
  try { return JSON.parse(localStorage.getItem('lift_history') || '[]'); } catch(e) { return []; }
}
function saveHistory(hist) {
  try { localStorage.setItem('lift_history', JSON.stringify(hist)); } catch(e) {}
}
function getLastLogged(key) {
  const hist = getHistory();
  for (let i = 0; i < hist.length; i++) {
    const e = hist[i];
    if (e.type === 'lift' && e.key === key && e.sets && e.sets.length > 0) {
      return e.sets;
    }
  }
  return null;
}
function getPRs() {
  try { return JSON.parse(localStorage.getItem('lift_prs') || '{}'); } catch(e) { return {}; }
}
function savePRs(prs) {
  try { localStorage.setItem('lift_prs', JSON.stringify(prs)); } catch(e) {}
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function dateKey() { return new Date().toISOString().split('T')[0]; }
function todayLabel() { return new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}); }
function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function safeId(str) { return str.replace(/[^a-zA-Z0-9]/g,'_'); }
function exerciseKey(week, muscle, name) { return `${week}|${muscle}|${name}`; }

// ─── WEEK / NAV ───────────────────────────────────────────────────────────────
function setWeek(w) {
  currentWeek = w;
  document.getElementById('wbtn-a').className = 'week-btn' + (w==='A' ? ' active-a' : '');
  document.getElementById('wbtn-b').className = 'week-btn' + (w==='B' ? ' active-b' : '');
  renderTabBar();
  renderMain();
}
function switchNav(nav) {
  activeNav = nav;
  ['workout','cardio','kb','history'].forEach(n => {
    document.getElementById('nav-'+n).classList.toggle('active', n===nav);
  });
  const hdr = document.querySelector('.app-header');
  hdr.style.display = (nav === 'workout') ? '' : 'none';
  renderMain();
}
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    const isActive = b.dataset.tab === tab;
    b.className = 'tab-btn' + (isActive ? (currentWeek==='B' ? ' active-b' : ' active-a') : '');
  });
  renderMain();
}
function renderTabBar() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = MUSCLE_TABS.map(t => {
    const isActive = t === activeTab;
    const cls = 'tab-btn' + (isActive ? (currentWeek==='B' ? ' active-b' : ' active-a') : '');
    return `<button class="${cls}" data-tab="${t}" onclick="switchTab('${t}')">${MUSCLE_LABELS[t]}</button>`;
  }).join('');
}

// ─── INIT SETS ────────────────────────────────────────────────────────────────
function ensureSets(key, count, lastLogged) {
  if (!workoutSets[key]) {
    workoutSets[key] = Array.from({length:count}, (_,i) => {
      const prev = lastLogged && lastLogged[i];
      return { kg:'', reps:'', done:false, phKg: prev ? prev.kg : '', phReps: prev ? prev.reps : '' };
    });
  }
}

// ─── RENDER MAIN ─────────────────────────────────────────────────────────────
function renderMain() {
  const main = document.getElementById('main');
  if (activeNav === 'workout') renderWorkout(main);
  else if (activeNav === 'cardio') renderCardio(main);
  else if (activeNav === 'kb') renderKB(main);
  else renderHistory(main);
}

// ─── WORKOUT ─────────────────────────────────────────────────────────────────
function renderWorkout(main) {
  const muscle = activeTab;
  const exList = muscle === 'shoulders' ? PROGRAM.shoulders : (PROGRAM[currentWeek][muscle] || []);
  exList.forEach(ex => {
    const key = exerciseKey(currentWeek, muscle, ex.name);
    const last = getLastLogged(key);
    ensureSets(key, ex.sets, last);
  });

  let doneSets=0, totalVol=0, doneEx=0;
  exList.forEach(ex => {
    const key = exerciseKey(currentWeek, muscle, ex.name);
    const sets = workoutSets[key] || [];
    let exHasDone=false;
    sets.forEach(s => {
      if(s.done){doneSets++;exHasDone=true;}
      totalVol += (parseFloat(s.kg)||0)*(parseInt(s.reps)||0);
    });
    if(exHasDone) doneEx++;
  });

  const weekColor = currentWeek === 'A' ? '#8b1a1a' : '#2d6a4f';
  const weekLabel = muscle==='shoulders' ? 'ALL WEEKS' : `WEEK ${currentWeek} — ${currentWeek==='A'?'PRESS & POWER':'VOLUME & ISOLATION'}`;
  let html = `<div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:12px;">${weekLabel}</div>`;
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-label">Sets done</div><div class="stat-val" style="color:${weekColor}" id="s-done">${doneSets}</div></div>
    <div class="stat-card"><div class="stat-label">Volume kg</div><div class="stat-val" id="s-vol">${totalVol>=1000?(totalVol/1000).toFixed(1)+'k':Math.round(totalVol)}</div></div>
    <div class="stat-card"><div class="stat-label">Exercises</div><div class="stat-val" id="s-ex">${doneEx}/${exList.length}</div></div>
  </div>`;

  exList.forEach(ex => {
    const key = exerciseKey(currentWeek, muscle, ex.name);
    const sets = workoutSets[key] || [];
    const prs = getPRs();
    const pr = prs[key];
    const sid = safeId(key);
    html += `<div class="ex-card">
      <div class="ex-header">
        <div>
          <div class="ex-name">${ex.name}</div>
          ${pr ? `<div class="ex-pr">PR: ${pr.kg}kg × ${pr.reps}</div>` : ''}
        </div>
        <div class="ex-header-right">
          <span class="ex-sets-badge">${sets.filter(s=>s.done).length}/${ex.sets} SETS</span>
          <button class="btn-add-set" onclick="addSet('${key}','${sid}')">+ SET</button>
        </div>
      </div>
      <div class="sets-wrap">
        <div class="set-col-headers">
          <span class="set-ch"></span>
          <span class="set-ch">KG</span>
          <span class="set-ch">REPS</span>
          <span class="set-ch"></span>
          <span class="set-ch"></span>
        </div>
        <div id="sets-${sid}">`;
    sets.forEach((s,i) => { html += buildSetRow(key, sid, i, s); });
    html += `</div></div></div>`;
  });

  const doneSetsAll = (() => { let d=0; exList.forEach(ex=>{ const k=exerciseKey(currentWeek,muscle,ex.name); (workoutSets[k]||[]).forEach(s=>{if(s.done)d++;}); }); return d; })();
  html += `<div style="margin-top:8px;padding-bottom:4px;">
    <button onclick="logFullSession()" style="width:100%;padding:14px;background:${weekColor};border:none;border-radius:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:opacity .15s;" ontouchstart="this.style.opacity='.8'" ontouchend="this.style.opacity='1'">LOG SESSION</button>
  </div>`;

  main.innerHTML = html;
}

function buildSetRow(key, sid, i, s) {
  const done = s.done;
  const ic = done ? ' done-inp' : '';
  const ph_kg = s.phKg || '';
  const ph_reps = s.phReps || '';
  return `<div class="set-row" id="sr-${sid}-${i}">
    <span class="set-num">${i+1}</span>
    <input class="set-input${ic}" type="number" inputmode="decimal" placeholder="${ph_kg}" value="${s.kg||''}" onchange="updateSet('${key}','${sid}',${i},'kg',this.value)">
    <input class="set-input${ic}" type="number" inputmode="numeric" placeholder="${ph_reps}" value="${s.reps||''}" onchange="updateSet('${key}','${sid}',${i},'reps',this.value)">
    <button class="done-btn${done?' done':''}" onclick="toggleDone('${key}','${sid}',${i})">
      ${done?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--green')||'#27ae60'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>`:''}
    </button>
    <button class="del-btn" onclick="delSet('${key}','${sid}',${i})">×</button>
  </div>`;
}

function addSet(key, sid) {
  if(!workoutSets[key]) workoutSets[key]=[];
  const last = workoutSets[key].length > 0 ? workoutSets[key][workoutSets[key].length-1] : null;
  workoutSets[key].push({kg:'',reps:'',done:false,phKg:last?last.kg:'',phReps:last?last.reps:''});
  const c = document.getElementById('sets-'+sid);
  const i = workoutSets[key].length-1;
  if(c){ const d=document.createElement('div'); d.innerHTML=buildSetRow(key,sid,i,workoutSets[key][i]); c.appendChild(d.firstElementChild); }
  saveAll(); refreshStats();
}

function delSet(key, sid, i) {
  if(!workoutSets[key]) return;
  workoutSets[key].splice(i,1);
  if(workoutSets[key].length===0) workoutSets[key].push({kg:'',reps:'',done:false});
  saveAll(); renderMain();
}

function updateSet(key, sid, i, field, val) {
  if(!workoutSets[key]) return;
  workoutSets[key][i][field]=val;
  saveAll(); refreshStats(); checkPR(key);
}

function toggleDone(key, sid, i) {
  if(!workoutSets[key]) return;
  const s = workoutSets[key][i];
  s.done = !s.done;
  const row = document.getElementById(`sr-${sid}-${i}`);
  if(row){
    const inputs = row.querySelectorAll('.set-input');
    const btn = row.querySelector('.done-btn');
    inputs.forEach(inp => { inp.className='set-input'+(s.done?' done-inp':''); });
    btn.className='done-btn'+(s.done?' done':'');
    btn.innerHTML = s.done?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>`:'';
  }
  if(s.done && s.kg && s.reps) { saveToHistory(key); checkPR(key); }
  saveAll(); refreshStats();
  // update badge
  const exList = activeTab==='shoulders' ? PROGRAM.shoulders : (PROGRAM[currentWeek][activeTab]||[]);
  const ex = exList.find(e=>exerciseKey(currentWeek,activeTab,e.name)===key);
  if(ex){
    const sets=workoutSets[key]||[];
    const badges=document.querySelectorAll('.ex-sets-badge');
    badges.forEach(b=>{});
  }
}

function checkPR(key) {
  const sets = workoutSets[key]||[];
  let best=0,bestSet=null;
  sets.forEach(s=>{ const v=(parseFloat(s.kg)||0)*(parseInt(s.reps)||0); if(v>best){best=v;bestSet=s;}});
  if(!bestSet||best===0) return;
  const prs=getPRs();
  const ex=prs[key];
  const exVol=ex?(parseFloat(ex.kg)||0)*(parseInt(ex.reps)||0):0;
  if(best>exVol){
    prs[key]={kg:bestSet.kg,reps:bestSet.reps};
    savePRs(prs);
    if(ex) toast('New PR!');
  }
}

function refreshStats() {
  const muscle=activeTab;
  const exList=muscle==='shoulders'?PROGRAM.shoulders:(PROGRAM[currentWeek][muscle]||[]);
  let doneSets=0,totalVol=0,doneEx=0;
  exList.forEach(ex=>{
    const key=exerciseKey(currentWeek,muscle,ex.name);
    const sets=workoutSets[key]||[];
    let exH=false;
    sets.forEach(s=>{if(s.done){doneSets++;exH=true;}totalVol+=(parseFloat(s.kg)||0)*(parseInt(s.reps)||0);});
    if(exH) doneEx++;
  });
  const ds=document.getElementById('s-done'),sv=document.getElementById('s-vol'),se=document.getElementById('s-ex');
  if(ds) ds.textContent=doneSets;
  if(sv) sv.textContent=totalVol>=1000?(totalVol/1000).toFixed(1)+'k':Math.round(totalVol);
  if(se) se.textContent=`${doneEx}/${exList.length}`;
}

function logFullSession() {
  const muscle = activeTab;
  const exList = muscle==='shoulders' ? PROGRAM.shoulders : (PROGRAM[currentWeek][muscle]||[]);
  let savedCount = 0;
  exList.forEach(ex => {
    const key = exerciseKey(currentWeek, muscle, ex.name);
    const sets = (workoutSets[key]||[]).filter(s => s.kg || s.reps);
    if(sets.length > 0) {
      const hist = getHistory();
      const existing = hist.findIndex(h => h.type==='lift' && h.key===key && h.date===dateKey());
      const entry = {type:'lift',key,week:currentWeek,muscle,exercise:ex.name,date:dateKey(),ts:Date.now(),sets:sets.map(s=>({kg:s.kg,reps:s.reps}))};
      if(existing>=0) hist[existing]=entry; else hist.unshift(entry);
      if(hist.length>800) hist.splice(800);
      saveHistory(hist);
      savedCount++;
      checkPR(key);
    }
  });
  if(savedCount===0){ toast('No sets to log'); return; }
  toast(`Session saved — ${savedCount} exercise${savedCount!==1?'s':''}`);
}

function saveToHistory(key) {
  const sets=workoutSets[key]||[];
  const parts=key.split('|');
  const hist=getHistory();
  const existing=hist.findIndex(h=>h.type==='lift'&&h.key===key&&h.date===dateKey());
  const entry={type:'lift',key,week:parts[0],muscle:parts[1],exercise:parts[2],date:dateKey(),ts:Date.now(),sets:sets.filter(s=>s.done).map(s=>({kg:s.kg,reps:s.reps}))};
  if(existing>=0) hist[existing]=entry; else hist.unshift(entry);
  if(hist.length>800) hist.splice(800);
  saveHistory(hist);
}

function setCardioType(t){cardioState.type=t;renderCardio(document.getElementById('main'));}
function setIntensity(i){cardioState.intensity=i;renderCardio(document.getElementById('main'));}
function updateCardio(f,v){cardioState[f]=v;}
function logCardio(){
  const c=cardioState;
  if(!c.dur&&!c.dist){toast('Add duration or distance');return;}
  const hist=getHistory();
  hist.unshift({type:'cardio',subtype:c.type,date:dateKey(),ts:Date.now(),dur:c.dur,dist:c.dist,hr:c.hr,cals:c.cals,pace:c.pace,intensity:c.intensity,notes:c.notes});
  if(hist.length>800) hist.splice(800);
  saveHistory(hist);
  cardioState={type:c.type,dur:'',dist:'',hr:'',cals:'',pace:'',intensity:'',notes:''};
  toast('Session logged');
  renderCardio(document.getElementById('main'));
}

// ─── KETTLEBELL ───────────────────────────────────────────────────────────────
function renderKB(main) {
  const kb=kbState;
  const mins=Math.floor(kb.timeLeft/60).toString().padStart(2,'0');
  const secs=(kb.timeLeft%60).toString().padStart(2,'0');
  const isRest=kb.phase==='rest';
  main.innerHTML=`<div style="padding-top:8px;">
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:14px;">KETTLEBELL CIRCUIT</div>
  <div class="kb-timer-card">
    <div class="kb-phase-label">${kb.running?(isRest?'REST':'WORK'):'READY'}</div>
    <div class="kb-timer-display${isRest?' rest-phase':''}">${mins}:${secs}</div>
    <div class="kb-rounds-info">Round ${kb.currentRound} of ${kb.rounds}</div>
    <div class="kb-controls-grid">
      <div class="kb-ctrl-field">
        <span class="kb-ctrl-label">Work (sec)</span>
        <input class="kb-ctrl-input" type="number" inputmode="numeric" value="${kb.work}" onchange="setKB('work',this.value)" ${kb.running?'disabled':''}>
      </div>
      <div class="kb-ctrl-field">
        <span class="kb-ctrl-label">Rest (sec)</span>
        <input class="kb-ctrl-input" type="number" inputmode="numeric" value="${kb.rest}" onchange="setKB('rest',this.value)" ${kb.running?'disabled':''}>
      </div>
      <div class="kb-ctrl-field">
        <span class="kb-ctrl-label">Rounds</span>
        <input class="kb-ctrl-input" type="number" inputmode="numeric" value="${kb.rounds}" onchange="setKB('rounds',this.value)" ${kb.running?'disabled':''}>
      </div>
    </div>
    <div class="kb-btn-row">
      <button class="kb-start-btn ${kb.running?'stop':'go'}" onclick="toggleKB()">${kb.running?'PAUSE':'START'}</button>
      <button class="kb-start-btn reset" onclick="resetKB()">RESET</button>
    </div>
  </div>
  <div class="kb-ex-list">
    ${KB_EXERCISES.map((e,i)=>`<div class="kb-ex-item">
      <div class="kb-ex-dot${kb.running&&kb.phase==='work'&&i===kb.currentEx%KB_EXERCISES.length?' active-ex':''}"></div>
      <span class="kb-ex-name">${e}</span>
    </div>`).join('')}
  </div>
  </div>`;
}
function setKB(f,v){kbState[f]=parseInt(v)||0;if(!kbState.running){if(f==='work')kbState.timeLeft=kbState.work;}renderKB(document.getElementById('main'));}
function toggleKB(){
  if(kbState.running){clearInterval(kbState.timer);kbState.timer=null;kbState.running=false;}
  else{
    kbState.running=true;
    if(kbState.timeLeft<=0){kbState.timeLeft=kbState.work;kbState.phase='work';}
    kbState.timer=setInterval(()=>{
      kbState.timeLeft--;
      if(kbState.timeLeft<=0){
        if(kbState.phase==='work'){
          kbState.phase='rest';kbState.timeLeft=kbState.rest;kbState.currentEx++;
        } else {
          kbState.phase='work';kbState.timeLeft=kbState.work;kbState.currentRound++;
          if(kbState.currentRound>kbState.rounds){clearInterval(kbState.timer);kbState.timer=null;kbState.running=false;kbState.currentRound=1;kbState.phase='work';kbState.timeLeft=kbState.work;kbState.currentEx=0;toast('Circuit complete!');}
        }
      }
      if(activeNav==='kb') renderKB(document.getElementById('main'));
    },1000);
  }
  renderKB(document.getElementById('main'));
}
function resetKB(){clearInterval(kbState.timer);kbState.timer=null;kbState.running=false;kbState.phase='work';kbState.timeLeft=kbState.work;kbState.currentRound=1;kbState.currentEx=0;renderKB(document.getElementById('main'));}


// ─── HISTORY ──────────────────────────────────────────────────────────────────
function renderHistory(main) {
  const hist = getHistory();
  if(hist.length===0){
    main.innerHTML=`<div style="padding-top:40px;"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-txt">No workouts logged yet.<br>Complete a set to see history here.</div></div></div>`;
    return;
  }
  const grouped={};
  hist.forEach(e=>{
    if(!grouped[e.date]) grouped[e.date]=[];
    grouped[e.date].push(e);
  });
  let html=`<div style="padding-top:8px;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:14px;">WORKOUT HISTORY</div>`;
  Object.keys(grouped).sort().reverse().forEach(date=>{
    html+=`<div class="history-day"><div class="history-day-label">${fmtDate(date)}</div>`;
    const entries=grouped[date];
    const seen=new Set();
    entries.forEach((e,idx)=>{
      const uid=e.type+'|'+(e.key||e.subtype||'');
      if(seen.has(uid)) return; seen.add(uid);
      const histIdx=hist.indexOf(e);
      if(e.type==='lift'){
        const relSets=entries.filter(x=>x.type==='lift'&&x.key===e.key);
        const vol=e.sets?e.sets.reduce((a,s)=>(a+(parseFloat(s.kg)||0)*(parseInt(s.reps)||0)),0):0;
        const badgeCls=e.week==='B'?'badge-b':'badge-a';
        const muscleLabel=e.muscle?e.muscle.charAt(0).toUpperCase()+e.muscle.slice(1):'';
        html+=`<div class="hist-entry">
          <div class="hist-entry-top">
            <div><div class="hist-entry-name">${e.exercise||''}</div>
            <div class="hist-entry-meta">${e.sets?e.sets.length:0} sets · ${Math.round(vol)}kg volume · ${muscleLabel}</div></div>
            <span class="hist-badge ${badgeCls}">WK ${e.week}</span>
          </div>
          <div class="hist-actions">
            <button class="hist-action-btn" onclick="openEditModal(${histIdx})">EDIT</button>
            <button class="hist-action-btn del" onclick="deleteHistEntry(${histIdx})">DELETE</button>
          </div>
        </div>`;
      } else if(e.type==='cardio'){
        const meta=[e.dur?e.dur+'min':'',e.dist?e.dist+'km':'',e.cals?e.cals+'kcal':'',e.intensity?e.intensity.toUpperCase():''].filter(Boolean).join(' · ');
        html+=`<div class="hist-entry">
          <div class="hist-entry-top">
            <div><div class="hist-entry-name">${e.subtype||'Cardio'}</div>
            <div class="hist-entry-meta">${meta}</div></div>
            <span class="hist-badge badge-cardio">CARDIO</span>
          </div>
          <div class="hist-actions">
            <button class="hist-action-btn del" onclick="deleteHistEntry(${histIdx})">DELETE</button>
          </div>
        </div>`;
      }
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  main.innerHTML=html;
}

function deleteHistEntry(idx){
  const hist=getHistory();
  hist.splice(idx,1);
  saveHistory(hist);
  toast('Deleted');
  renderHistory(document.getElementById('main'));
}

function openEditModal(idx){
  const hist=getHistory();
  const e=hist[idx];
  if(!e||e.type!=='lift') return;
  const sets=e.sets||[];
  const root=document.getElementById('modal-root');
  const sid=safeId(e.key||'');
  let setsHtml=sets.map((s,i)=>`
    <div class="modal-set-row" id="msr-${i}">
      <span class="set-num">${i+1}</span>
      <input class="set-input" type="number" inputmode="decimal" placeholder="kg" value="${s.kg||''}" onchange="editModalSet(${idx},${i},'kg',this.value)">
      <input class="set-input" type="number" inputmode="numeric" placeholder="reps" value="${s.reps||''}" onchange="editModalSet(${idx},${i},'reps',this.value)">
      <button class="del-btn" onclick="editModalDelSet(${idx},${i})">×</button>
    </div>`).join('');
  root.innerHTML=`<div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title">${e.exercise||''} <button class="modal-close" onclick="closeModal()">×</button></div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px;">${fmtDate(e.date)}</div>
      <div class="set-col-headers" style="margin-bottom:8px;">
        <span class="set-ch"></span><span class="set-ch">KG</span><span class="set-ch">REPS</span><span class="set-ch"></span>
      </div>
      <div id="modal-sets">${setsHtml}</div>
      <button class="btn-add-set" style="margin-top:8px;" onclick="editModalAddSet(${idx})">+ SET</button>
      <button class="modal-save-btn" onclick="saveModal(${idx})">SAVE CHANGES</button>
    </div>
  </div>`;
}

function editModalSet(histIdx,setIdx,field,val){
  const hist=getHistory();
  if(!hist[histIdx]||!hist[histIdx].sets) return;
  hist[histIdx].sets[setIdx][field]=val;
  saveHistory(hist);
}
function editModalDelSet(histIdx,setIdx){
  const hist=getHistory();
  if(!hist[histIdx]||!hist[histIdx].sets) return;
  hist[histIdx].sets.splice(setIdx,1);
  saveHistory(hist);
  openEditModal(histIdx);
}
function editModalAddSet(histIdx){
  const hist=getHistory();
  if(!hist[histIdx]) return;
  if(!hist[histIdx].sets) hist[histIdx].sets=[];
  hist[histIdx].sets.push({kg:'',reps:''});
  saveHistory(hist);
  openEditModal(histIdx);
}
function saveModal(histIdx){
  closeModal();
  toast('Saved');
  renderHistory(document.getElementById('main'));
}
function closeModal(e){
  if(e && e.target !== document.querySelector('.modal-overlay')) return;
  document.getElementById('modal-root').innerHTML='';
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
loadAll();
document.getElementById('header-date') && (document.getElementById('header-date').textContent=todayLabel());
renderTabBar();
renderMain();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
